name: UI checks
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ui-checks-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Browser regression suite
        run: |
          export WIRESCAPE_CHROMIUM="$(node --input-type=module -e 'import { chromium } from "@playwright/test"; console.log(chromium.executablePath())')"
          npm test -- --max-failures=5
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-review-and-traces
          path: test-results/
  pi-ui:
    # Bootstrap the owner's current reviewed stack; thereafter use Run workflow.
    # Never run fork PRs or arbitrary PR branches on the physical runner.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.actor == github.repository_owner &&
       github.head_ref == 'phase/6-signature-polish')
    runs-on: [self-hosted, Linux, ARM64, pi, ui, pi5]
    timeout-minutes: 20
    concurrency:
      group: wirescape-physical-pi-ui
      cancel-in-progress: false
    env:
      WIRESCAPE_HEADED: '1'
      WIRESCAPE_PI_RUN: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check physical runner and desktop
        env:
          PI_UI_DISPLAY: ${{ vars.PI_UI_DISPLAY }}
          PI_UI_WAYLAND_DISPLAY: ${{ vars.PI_UI_WAYLAND_DISPLAY }}
          PI_UI_XDG_RUNTIME_DIR: ${{ vars.PI_UI_XDG_RUNTIME_DIR }}
        run: bash tools/pi-ui-preflight.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install ffmpeg
      - name: Headed Chromium regression and performance session
        run: npm test -- --max-failures=5
      - name: Upload Pi evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pi-ui-${{ github.sha }}
          path: |
            test-results/
            build_reports/pi-ui/
